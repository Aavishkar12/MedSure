# docker compose up --build        (API on :8000, worker, Postgres)
# Needs a .env file (copy .env.example) and firebase-service-account.json next to this file.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: medsure
      POSTGRES_PASSWORD: medsure
      POSTGRES_DB: medsure
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U medsure"]
      interval: 3s
      retries: 20

  api:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://medsure:medsure@db:5432/medsure
      FCM_CREDENTIALS_FILE: /secrets/firebase-service-account.json
    volumes: ["./firebase-service-account.json:/secrets/firebase-service-account.json:ro"]
    ports: ["8000:8000"]
    depends_on: { db: { condition: service_healthy } }

  worker:
    build: .
    command: python -m app.worker
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://medsure:medsure@db:5432/medsure
      FCM_CREDENTIALS_FILE: /secrets/firebase-service-account.json
    volumes: ["./firebase-service-account.json:/secrets/firebase-service-account.json:ro"]
    depends_on: { db: { condition: service_healthy } }

volumes:
  pgdata:
